name: Check skill bundle
on: [push, pull_request, workflow_dispatch]

jobs:
  offline:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev --extra dataframe
      - run: uv run --locked --extra dataframe python scripts/check_skill.py
      - run: uv run --locked --extra dataframe python -m unittest discover -s tests -p "test_*.py"
      - run: uv run --locked python -m unittest discover -s references/slides/scripts -p "*_test.py"
